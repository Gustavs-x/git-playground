name: docker-compose-demo

x-security-defaults: &security-defaults
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  web:
    <<: *security-defaults
    image: ghcr.io/gustavs-x/git-playground-web@sha256:8b4e2bef6da00c8cefd008bb7c62b15063d503b79d12865cbc687de900f2a8c3
    user: nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:8080"
    tmpfs:
      - /tmp:size=16m,mode=1777
    cpus: "0.50"
    mem_limit: 96m
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  api:
    <<: *security-defaults
    image: ghcr.io/gustavs-x/git-playground-api@sha256:09c6c9203b70bf51221112f683672d492a11190abdb0003c28900315408dd15d
    user: node
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:3000"
    environment:
      PORT: "3000"
      REDIS_URL: "redis://redis:6379"
      REDIS_USERNAME: "api"
      REDIS_PASSWORD_FILE: "/run/secrets/redis_password"
    secrets:
      - redis_password
    tmpfs:
      - /tmp:size=16m,mode=1777
    cpus: "1.00"
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready', {signal: AbortSignal.timeout(2500)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 10s

  redis:
    <<: *security-defaults
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    user: redis
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        password="$$(cat /run/secrets/redis_password)"
        printf 'user default off\nuser api on >%s ~compose-demo:api:* resetchannels -@all +ping +get +set\n' "$$password" > /tmp/users.acl
        printf 'appendonly yes\naclfile /tmp/users.acl\n' > /tmp/redis.conf
        unset password
        exec redis-server /tmp/redis.conf
    secrets:
      - redis_password
    tmpfs:
      - /tmp:size=16m,mode=1777
    cpus: "0.50"
    mem_limit: 256m
    pids_limit: 64
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli --user api --raw ping | grep -qx PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

secrets:
  redis_password:
    file: ./secrets/redis_password.txt

volumes:
  redis-data:
