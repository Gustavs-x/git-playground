name: docker-compose-demo

services:
  web:
    image: ghcr.io/gustavs-x/git-playground-web@sha256:28971f85dee94eaf12f210d28c983a19ebd8a355de1aedd639ae893b684cf9b5
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  api:
    image: ghcr.io/gustavs-x/git-playground-api@sha256:a44344876cdc6eb0ca7ad7127d4a14fbf391656d76ec78d230f2ba8a1fc639ea
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:3000"
    environment:
      PORT: "3000"
      REDIS_URL: "redis://redis:6379"
      REDIS_USERNAME: "api"
      REDIS_PASSWORD_FILE: "/run/secrets/redis_password"
    secrets:
      - redis_password
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready', {signal: AbortSignal.timeout(2500)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    user: redis
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        password="$$(cat /run/secrets/redis_password)"
        printf 'user default off\nuser api on >%s ~compose-demo:api:* resetchannels -@all +ping +get +set\n' "$$password" > /tmp/users.acl
        printf 'appendonly yes\naclfile /tmp/users.acl\n' > /tmp/redis.conf
        unset password
        exec redis-server /tmp/redis.conf
    secrets:
      - redis_password
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli --user api --raw ping | grep -qx PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

secrets:
  redis_password:
    file: ./secrets/redis_password.txt

volumes:
  redis-data:
