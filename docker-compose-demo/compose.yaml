services:
  web:
    build: .
    ports:
      - "127.0.0.1:8084:80"

  api:
    build: ./api
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:3000"
    environment:
      PORT: "3000"
      REDIS_URL: "redis://redis:6379"
      REDIS_PASSWORD_FILE: "/run/secrets/redis_password"
      REDIS_USERNAME: "api"
    secrets:
      - redis_password
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready', {signal: AbortSignal.timeout(2500)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    user: redis
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        password="$$(cat /run/secrets/redis_password)"
        printf 'user default off\nuser api on >%s ~compose-demo:api:* resetchannels -@all +ping +get +set\n' "$$password" > /tmp/users.acl
        printf 'appendonly yes\naclfile /tmp/users.acl\n' > /tmp/redis.conf
        unset password
        exec redis-server /tmp/redis.conf
    secrets:
      - redis_password
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli --user api --raw ping | grep -qx PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

secrets:
  redis_password:
    file: ./secrets/redis_password.txt

volumes:
  redis-data:
