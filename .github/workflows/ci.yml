name: Basic CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify required files
        shell: bash
        run: |
          test -f README.md
          test -f test1.html

      - name: Check basic HTML structure
        shell: bash
        run: |
          grep -qi '<!DOCTYPE html>' test1.html
          grep -qi '<html' test1.html
          grep -qi '</html>' test1.html
